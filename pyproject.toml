[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dpf2"
version = "0.1.0"
description = "Minimal Dense Plasma Focus simulator"
requires-python = ">=3.10"
dependencies = [
    "matplotlib",
    "numba",
    "numpy",
    "pydantic",
    "scipy",
    "sympy"
]

[project.optional-dependencies]
server = [
    "flask",
    "flask-sock",
    "werkzeug"
]
warpx = [
    "pywarpx",
    "amrex_solver",
    "amrex",
    "adios2",
    "picmi",
    "h5py>=3.7.0"
]
telemetry = [
    "opencensus"
]
radiation = [
    "amrex",
    "adios2",
]

[project.scripts]
dpf2 = "dpf2.cli.main:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
