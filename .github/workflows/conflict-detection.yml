name: Conflict Detection and Resolution

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_target:
    types: [opened, synchronize, reopened]

jobs:
  check-conflicts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black flake8 mypy

    - name: Configure Git
      run: |
        git config --global user.name "Conflict Bot"
        git config --global user.email "conflict-bot@github.com"

    - name: Fetch base branch
      run: |
        git fetch origin ${{ github.event.pull_request.base.ref }}:${{ github.event.pull_request.base.ref }}
        git fetch origin ${{ github.event.pull_request.head.ref }}:${{ github.event.pull_request.head.ref }}

    - name: Check for merge conflicts
      id: conflict-check
      run: |
        # Switch to PR branch
        git checkout ${{ github.event.pull_request.head.ref }}

        # Attempt merge with base branch
        git merge-tree $(git merge-base HEAD origin/${{ github.event.pull_request.base.ref }}) HEAD origin/${{ github.event.pull_request.base.ref }} > merge_result.txt

        # Check for conflicts
        if grep -q "<<<< " merge_result.txt; then
          echo "conflicts=true" >> $GITHUB_OUTPUT
          echo "Conflicts detected!"

          # Extract conflicted files
          grep -B5 -A5 "<<<< " merge_result.txt | grep "^@@" | sed 's/^@@ .* @@//' | sort -u > conflicted_files.txt

          echo "Conflicted files:"
          cat conflicted_files.txt

          # Run conflict analysis
          python scripts/resolve_conflicts.py --verbose > conflict_report.txt 2>&1 || true

        else
          echo "conflicts=false" >> $GITHUB_OUTPUT
          echo "No conflicts detected."
        fi

    - name: Run automated conflict resolution
      if: steps.conflict-check.outputs.conflicts == 'true'
      run: |
        echo "Attempting automated conflict resolution..."
        python scripts/resolve_conflicts.py --auto --strategy smart --verbose > auto_resolution.txt 2>&1

        # Check if auto-resolution was successful
        if [ $? -eq 0 ]; then
          echo "auto_resolved=true" >> $GITHUB_OUTPUT
          echo "✅ Conflicts automatically resolved!"
        else
          echo "auto_resolved=false" >> $GITHUB_OUTPUT
          echo "❌ Manual conflict resolution required."
        fi

    - name: Generate conflict report
      if: steps.conflict-check.outputs.conflicts == 'true'
      run: |
        cat > pr_comment.md << 'EOF'
        ## 🔍 Merge Conflict Detection Report

        This pull request has merge conflicts that prevent it from being merged automatically.

        ### Conflict Analysis
        ```
        $(cat conflict_report.txt 2>/dev/null || echo "Conflict analysis failed")
        ```

        ### Automated Resolution Attempt
        ```
        $(cat auto_resolution.txt 2>/dev/null || echo "Auto-resolution not attempted")
        ```

        ### Next Steps

        #### Option 1: Rebase your branch (Recommended)
        ```bash
        git fetch origin
        git checkout ${{ github.event.pull_request.head.ref }}
        git rebase origin/${{ github.event.pull_request.base.ref }}
        # Resolve any conflicts manually
        git push --force-with-lease origin ${{ github.event.pull_request.head.ref }}
        ```

        #### Option 2: Use the conflict resolution script
        ```bash
        python scripts/resolve_conflicts.py --auto --strategy smart
        ```

        #### Option 3: Manual resolution
        1. Merge the base branch into your feature branch
        2. Resolve conflicts in each file manually
        3. Test your changes
        4. Commit and push

        ### Conflict Prevention Tips
        - Keep your feature branches small and focused
        - Regularly rebase against the main branch
        - Install pre-commit hooks: `python scripts/resolve_conflicts.py --install-hooks`
        - Run formatting tools before committing: `python -m black .`

        ---
        *This comment was automatically generated by the Conflict Detection workflow.*
        EOF

    - name: Comment on PR with conflict report
      if: steps.conflict-check.outputs.conflicts == 'true'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const comment = fs.readFileSync('pr_comment.md', 'utf8');

          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });

    - name: Update PR status
      uses: actions/github-script@v7
      with:
        script: |
          const conflicts = '${{ steps.conflict-check.outputs.conflicts }}' === 'true';
          const autoResolved = '${{ steps.auto-resolved }}' === 'true';

          const state = conflicts ? (autoResolved ? 'success' : 'failure') : 'success';
          const description = conflicts ?
            (autoResolved ? 'Conflicts auto-resolved' : 'Manual conflict resolution required') :
            'No conflicts detected';

          github.rest.repos.createCommitStatus({
            owner: context.repo.owner,
            repo: context.repo.repo,
            sha: '${{ github.event.pull_request.head.sha }}',
            state: state,
            target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            description: description,
            context: 'Conflict Detection'
          });

    - name: Upload conflict artifacts
      if: steps.conflict-check.outputs.conflicts == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: conflict-analysis-${{ github.event.pull_request.number }}
        path: |
          conflict_report.txt
          auto_resolution.txt
          conflicted_files.txt
          merge_result.txt
        retention-days: 30

  format-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install formatting tools
      run: |
        python -m pip install --upgrade pip
        pip install black flake8

    - name: Check Python formatting
      run: |
        echo "Checking Python code formatting..."
        python -m black --check --diff . || {
          echo "❌ Python formatting issues found!"
          echo "Run 'python -m black .' to fix formatting."
          exit 1
        }
        echo "✅ Python formatting looks good!"

    - name: Check for whitespace issues
      run: |
        echo "Checking for whitespace issues..."
        git diff --check HEAD~1 || {
          echo "❌ Whitespace issues found!"
          exit 1
        }
        echo "✅ No whitespace issues found!"