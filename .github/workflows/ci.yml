name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install .[server,warpx]
          pip install ruff flake8 mypy pytest
      - name: Ruff
        run: ruff check .
      - name: Flake8
        run: flake8 .
      - name: Type check
        run: mypy .
      - name: Test
        run: pytest
      - name: Validate pinch benchmarks
        run: python scripts/validate_pinch.py

