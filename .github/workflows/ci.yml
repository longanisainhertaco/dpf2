name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for conflict detection
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install .[server,warpx]
          pip install ruff flake8 mypy pytest
      - name: Check for merge conflicts (PR only)
        if: github.event_name == 'pull_request'
        run: |
          echo "Checking for potential merge conflicts..."
          python scripts/resolve_conflicts.py --verbose || echo "Conflict check completed"
      - name: Ruff
        run: ruff check .
      - name: Flake8
        run: flake8 .
      - name: Type check
        run: mypy .
      - name: Unit tests
        run: pytest --ignore=tests/validation
      - name: Validation tests
        run: pytest tests/validation -q
      - name: Validate pinch benchmarks
        run: python scripts/validate_pinch.py
      - name: MHD performance scaling
        run: pytest tests/test_mhd_performance.py -q
