name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          pip install .[server,warpx]
          pip install ruff flake8 mypy pytest
      - name: Ruff
        run: ruff check .
      - name: Flake8
        run: flake8 .
      - name: Type check
        run: mypy .
      - name: Test
        run: pytest
      - name: Validation benchmark
        run: python -m dpf2.cli.validate --config examples/config.json --dataset PF1000

